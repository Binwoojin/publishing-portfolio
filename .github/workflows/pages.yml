name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 작업물마다 검색 · 공유용 페이지(work/<아이디>/)와 sitemap.xml 을 다시 만든다 — 관리 화면에서 고친 내용도 반영
      - name: Build SEO pages
        run: node tools/seo/build.mjs
      # 사이트에 쓰인 글자만 담은 작은 글꼴을 다시 만든다 — 관리 화면에서 새로 쓴 글자도 작은 글꼴에 들어가게
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Subset site fonts
        run: |
          pip install --quiet fonttools brotli
          python3 tools/fonts/subset.py
      # 사이트가 쓰는 건 projects/<작업물>/publishing 뿐이라, 템플릿 · 원본 소스 · 문서 · 도구는 배포에서 뺀다 (검색 결과에 섞이지 않게)
      - name: Leave out templates and source copies
        run: |
          for d in projects/*/; do find "$d" -mindepth 1 -maxdepth 1 ! -name publishing -exec rm -rf {} +; done
          rm -rf projects/_template
      # data/site.json 의 searchIndexing 이 true 가 아니면 모든 페이지에 noindex (검색 엔진 등록 보류)
      - name: Search engine indexing switch
        run: node tools/seo/indexing.mjs
      - name: Leave out tools
        run: rm -rf tools
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

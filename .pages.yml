# Pages CMS 설정 (https://pagescms.org)
# app.pagescms.org 에 GitHub 계정으로 로그인 → 이 저장소를 열면 아래 메뉴가 관리 화면에 나타납니다.

media:
  input: assets/images
  output: assets/images
  categories: [image]
  rename: safe

content:
  - name: projects
    label: 작업물
    description: 포트폴리오에 보이는 작업물 목록입니다. 위에 있는 항목이 먼저 보입니다.
    type: file
    path: data/projects.json
    format: json
    list: true
    fields:
      - name: title
        label: 프로젝트 이름
        type: string
        required: true
      - name: desc
        label: 한 줄 설명
        type: string
      - name: category
        label: 분류
        description: 같은 분류끼리 필터 버튼으로 묶입니다. (예 - 반응형, 모바일, 접근성)
        type: string
      - name: tags
        label: 사용 기술
        description: HTML, CSS 처럼 하나씩 추가하세요.
        type: string
        list: true
      - name: thumbnail
        label: 썸네일 이미지
        description: 권장 비율 16:10 (예 - 1600×1000)
        type: image
      - name: period
        label: 작업 기간
        description: 예 - 2026.09
        type: string
      - name: contribution
        label: 기여도
        description: 예 - 퍼블리싱 100%
        type: string
      - name: caseStudy
        label: 상세페이지 ID
        description: 작업물 상세(data/cases/아이디.json)의 아이디. 예 - growlog (비우면 '자세히 보기' 버튼이 없습니다)
        type: string
      - name: demo
        label: Live Demo 링크
        description: 예 - projects/my-project/ 또는 https://...
        type: string

  - name: site
    label: 사이트 정보
    description: 이름, 연락처, 소개 문구, 기술 목록을 수정합니다.
    type: file
    path: data/site.json
    format: json
    fields:
      - name: name
        label: 사이트 이름
        description: 로고 · 브라우저 탭 제목 · 저작권 표시에 쓰입니다. (예 - Binwoojin)
        type: string
        required: true
      - name: realName
        label: 본명
        description: 소개 · Name 칸 · 검색 엔진 정보에 보이는 이름입니다. 위 '이름'(Binwoojin)은 사이트 이름(로고 · 탭 제목 · 저작권)에만 쓰입니다.
        type: string
      - name: role
        label: 직무
        type: string
      - name: email
        label: 이메일
        type: string
      - name: github
        label: GitHub 주소
        description: 예 - https://github.com/아이디
        type: string
      - name: searchIndexing
        label: 검색 엔진 등록
        description: 끄면(기본) 배포할 때 모든 페이지에 noindex 를 넣어 구글 · 네이버 검색에 나오지 않습니다. 링크로 제출 · 공유하는 것은 그대로 됩니다. 켜면 검색에 등록될 수 있으니, 그다음 Search Console 에 sitemap.xml 을 제출하세요.
        type: boolean
      - name: heroDescription
        label: 첫 화면 소개 문구
        type: text
      - name: focus
        label: 주요 분야
        type: string
      - name: highlight
        label: 주요 성과 (첫 화면 Work)
        description: 예 - 직접 기획한 서비스 2개 리디자인 · 화면 19개 퍼블리싱
        type: string
      - name: aboutLead
        label: About 강조 문장
        type: text
      - name: aboutBody
        label: About 본문
        type: text
      - name: journey
        label: 걸어온 과정 (About)
        description: 경력을 단계별로 요약합니다. 회사별 세부 업무는 이력서에 두고, 여기에는 흐름만 적어 주세요.
        type: object
        list: true
        fields:
          - name: period
            label: 기간
            description: 예 - 2022.01 – 2024.12
            type: string
          - name: title
            label: 단계 이름
            type: string
            required: true
          - name: places
            label: 회사 · 교육 기관
            description: 가운뎃점(·)으로 구분
            type: string
          - name: text
            label: 한 일 요약
            type: text
      - name: journeyNote
        label: 걸어온 과정 아래 안내
        description: 예 - 회사 결과물을 공개하지 않는 이유
        type: string
      - name: skills
        label: 기술 목록
        type: object
        list: true
        fields:
          - name: area
            label: 영역
            description: 예 - Design, Publishing, Frontend, Workflow (이름 위에 작은 글자로 보입니다)
            type: string
          - name: name
            label: 기술 이름
            type: string
            required: true
          - name: desc
            label: 설명
            type: string
          - name: tags
            label: 연결할 작업물 태그
            description: 작업물 목록의 태그와 같은 글자를 적으면 그 태그가 있는 작업물이 '쓴 작업물'로 보입니다 (예 - HTML, CSS, React, 웹 접근성). 비우면 보이지 않습니다.
            type: string
            list: true

  - name: cases
    label: 작업물 상세
    description: 작업물마다 하나씩 있는 상세페이지 내용입니다. 새로 만들 때 파일 이름을 영문 소문자로 정하고(예 - cafe.json), 작업물 목록의 '상세페이지 ID'에 같은 이름(cafe)을 적어 주세요. 비워 둔 구성은 상세페이지에 나오지 않습니다.
    type: collection
    path: data/cases
    format: json
    filename:
      template: "{primary}.json"
      field: create
    view:
      fields: [title, subtitle]
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: subtitle
        label: 한 줄 방향
        description: 예 - UI 리디자인 및 퍼블리싱
        type: string
      - name: summary
        label: 요약
        type: text
      - name: cover
        label: 대표 이미지
        type: image
      - name: coverVideo
        label: 대표 영상 (선택)
        description: 상세페이지 첫 화면에 자동 재생 · 반복 · 음소거로 보여 줄 MP4 경로입니다. 예 - assets/videos/cases/growlog-landing.mp4 (비우면 대표 이미지가 보입니다)
        type: string
      - name: coverPoster
        label: 대표 영상 포스터 (선택)
        description: 영상을 불러오기 전과 모션 줄이기 설정에서 보이는 정지 화면입니다. 비우면 대표 이미지를 씁니다.
        type: image
      - name: period
        label: 작업 기간 (선택)
        description: 비워 두면 작업물 목록의 작업 기간이 그대로 보입니다. 상세페이지에만 다른 기간을 쓰고 싶을 때만 적어 주세요.
        type: string
      - name: contribution
        label: 기여도 (선택)
        description: 비워 두면 작업물 목록의 기여도가 그대로 보입니다. 상세페이지에만 다르게 쓰고 싶을 때만 적어 주세요.
        type: string
      - name: tools
        label: 사용 기술
        type: string
        list: true
      - name: demo
        label: 결과물 링크
        type: string
      - name: layout
        label: 상세 구성 방식 (선택)
        description: 비우면 기본 9개 구성입니다. ux 라고 쓰면 UX 프로세스 순서(문제 → 사용자 → 정보 구조 · 흐름 → 디자인 결정 → Before & After → 디자인 시스템 → 결과 → 구현 · 검증)로 보여 주고, 아래 'UX' 항목들을 씁니다.
        type: string
      - name: overview
        label: 01 Project Overview
        type: object
        fields:
          - name: text
            label: 소개
            type: text
          - name: facts
            label: 요약 정보
            type: object
            list: true
            fields:
              - { name: label, label: 항목, type: string }
              - { name: value, label: 내용, type: string }
      - name: role
        label: 02 My Role
        description: 담당 비율(1인 프로젝트)과 코드를 직접 작성한 비율을 구분해 적습니다.
        type: object
        fields:
          - name: text
            label: 설명
            type: text
          - name: items
            label: 직접 판단 · 확인한 일
            type: string
            list: true
          - name: ai
            label: Claude Code가 보조한 일
            type: string
            list: true
      - name: beforeAfterIntro
        label: 03 Before & After 안내 문구
        description: 비워 두면 기본 안내(슬라이더 사용법)가 나옵니다.
        type: text
      - name: beforeAfter
        label: 03 Before & After
        description: 개선 전 · 후 이미지는 같은 크기로 캡처해야 비교 슬라이더가 정확하게 겹칩니다. '유지한 구조 / 다시 디자인한 점'을 쓰면 '개선 전 문제 / 개선 내용' 대신 그것이 보입니다.
        type: object
        list: true
        fields:
          - { name: title, label: 화면 이름, type: string }
          - { name: before, label: 개선 전 이미지, type: image }
          - { name: beforeAlt, label: 개선 전 이미지 설명 (대체 텍스트), type: string }
          - { name: after, label: 개선 후 이미지, type: image }
          - { name: afterAlt, label: 개선 후 이미지 설명 (대체 텍스트), type: string }
          - { name: kept, label: 유지한 구조, type: text }
          - { name: redesign, label: 다시 디자인한 점, type: text }
          - { name: problem, label: 개선 전 문제, type: text }
          - { name: improvement, label: 개선 내용, type: text }
          - name: regions
            label: 구조 비교 영역
            description: "같은 역할의 영역에 같은 번호를 붙입니다. 위치는 [가로 시작, 세로 시작, 너비, 높이]를 이미지 크기에 대한 %로 적습니다. 개선 전 위치를 비우면 '새로 추가(+)'로 표시됩니다."
            type: object
            list: true
            fields:
              - { name: label, label: 영역 이름, type: string }
              - { name: note, label: 바뀐 점, type: string }
              - { name: before, label: "개선 전 위치 (%)", type: number, list: true }
              - { name: after, label: "개선 후 위치 (%)", type: number, list: true }
      - name: process
        label: 04 Design Process
        type: object
        fields:
          - name: text
            label: 설명
            type: text
          - name: steps
            label: 과정
            type: object
            list: true
            fields:
              - { name: title, label: 단계 이름, type: string }
              - { name: text, label: 내용, type: text }
          - name: decisions
            label: 대표 개선 판단
            description: 대표 개선 2~3개를 문제 → 선택 이유 → 구현 → 확인 결과 순서로 적습니다.
            type: object
            list: true
            fields:
              - { name: title, label: 제목, type: string }
              - { name: problem, label: 문제, type: text }
              - { name: reason, label: 선택 이유, type: text }
              - { name: implementation, label: 구현, type: text }
              - { name: result, label: 확인 결과, type: text }
          - name: tokens
            label: 주요 색상 토큰
            type: object
            list: true
            fields:
              - { name: name, label: 이름, type: string }
              - { name: value, label: "색상값 (예 - #3F7D63)", type: string }
              - { name: note, label: 설명, type: string }
      - name: publishing
        label: 05 Publishing
        type: object
        list: true
        fields:
          - { name: title, label: 구분 (HTML · CSS · JavaScript), type: string }
          - { name: items, label: 구현 내용, type: string, list: true }
      - name: responsive
        label: 06 Responsive
        type: object
        fields:
          - name: text
            label: 설명
            type: text
          - name: shots
            label: 화면 캡처
            type: object
            list: true
            fields:
              - { name: label, label: 이름 (예 - 모바일 375px), type: string }
              - { name: image, label: 이미지, type: image }
              - { name: alt, label: 이미지 설명 (대체 텍스트), type: string }
      - name: accessibility
        label: 07 Accessibility
        type: string
        list: true
      - name: troubleshooting
        label: 08 Troubleshooting
        type: object
        list: true
        fields:
          - { name: title, label: 제목, type: string }
          - { name: problem, label: 문제, type: text }
          - { name: solution, label: 해결, type: text }
      - name: result
        label: 09 Result
        type: object
        fields:
          - name: metrics
            label: 결과 수치
            type: object
            list: true
            fields:
              - { name: label, label: 항목, type: string }
              - { name: value, label: 값, type: string }
              - { name: note, label: "출처 (예 - 2026.10.14 측정 / 작업 당시 기록)", type: string }
          - name: text
            label: 결과 설명
            type: text
          - name: verification
            label: 측정 근거
            description: tools/verify 의 검증 스크립트 결과(reports/아이디/report.json)를 옮겨 적습니다.
            type: object
            fields:
              - { name: measuredAt, label: "측정일 (예 - 2026-10-14)", type: string }
              - name: items
                label: 검사 결과
                type: object
                list: true
                fields:
                  - { name: label, label: 검사, type: string }
                  - { name: value, label: 결과, type: string }
                  - { name: scope, label: 범위, type: string }
              - { name: conditions, label: 검사 조건, type: string, list: true }
              - { name: report, label: "보고서 경로 (예 - reports/growlog/index.html)", type: string }
              - { name: note, label: 참고, type: text }
          - name: limitations
            label: 한계와 다음 단계
            type: string
            list: true
          - name: retrospective
            label: 회고
            description: 직접 느낀 점 · 다음에 다르게 해 볼 점을 적어 주세요. 비워 두면 회고 칸은 나오지 않습니다.
            type: text
      - name: problem
        label: UX · 문제 정의 · 목표
        type: object
        fields:
          - { name: text, label: 설명, type: text }
          - name: items
            label: 문제
            type: object
            list: true
            fields:
              - { name: title, label: 문제, type: string }
              - { name: text, label: 설명, type: text }
              - { name: evidence, label: 근거 (1차 버전에서 확인한 것), type: text }
          - { name: goalsTitle, label: 해결 기준 제목, type: string }
          - { name: goals, label: 해결 기준, type: string, list: true }
      - name: users
        label: UX · 사용자 · 이용 상황
        type: object
        fields:
          - { name: text, label: 설명, type: text }
          - name: items
            label: 사용자 유형
            type: object
            list: true
            fields:
              - { name: space, label: 공간, type: string }
              - { name: title, label: 이용 목적, type: string }
              - { name: situation, label: 상황, type: string }
              - { name: need, label: 필요한 것, type: string }
              - { name: answer, label: 서비스의 답, type: string }
          - { name: statesTitle, label: 사용자 상태 제목, type: string }
          - { name: statesText, label: 사용자 상태 설명, type: text }
          - name: states
            label: 사용자 상태
            type: object
            list: true
            fields:
              - { name: label, label: 상태, type: string }
              - { name: text, label: 이때 보여 줄 것, type: string }
      - name: flow
        label: UX · 정보 구조 · 사용자 흐름
        type: object
        fields:
          - { name: text, label: 설명, type: text }
          - { name: iaTitle, label: 정보 구조 제목, type: string }
          - name: ia
            label: 정보 구조 (메뉴별)
            type: object
            list: true
            fields:
              - { name: title, label: 메뉴, type: string }
              - { name: primary, label: 강조, type: boolean }
              - { name: items, label: 하위 화면 · 요소, type: string, list: true }
          - { name: iaNote, label: 정보 구조 메모, type: text }
          - { name: flowsTitle, label: 흐름 제목, type: string }
          - name: flows
            label: 사용자 흐름
            type: object
            list: true
            fields:
              - { name: title, label: 흐름 이름, type: string }
              - { name: steps, label: 단계, type: string, list: true }
              - { name: note, label: 메모, type: text }
      - name: designSystem
        label: UX · 디자인 시스템
        type: object
        fields:
          - { name: text, label: 설명, type: text }
          - name: tokens
            label: 색
            type: object
            list: true
            fields:
              - { name: name, label: 이름, type: string }
              - { name: value, label: "색상값 (예 - #596246)", type: string }
              - { name: note, label: 설명, type: string }
          - name: type
            label: 글꼴
            type: object
            list: true
            fields:
              - { name: name, label: 글꼴 이름, type: string }
              - { name: use, label: 쓰는 곳, type: text }
          - name: components
            label: 공통 컴포넌트
            type: object
            list: true
            fields:
              - { name: name, label: 이름, type: string }
              - { name: text, label: 설명, type: string }
          - { name: rulesTitle, label: 기준 제목, type: string }
          - { name: rules, label: 간격 · 모션 기준, type: string, list: true }

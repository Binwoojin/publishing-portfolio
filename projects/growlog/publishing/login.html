<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | GrowLog</title>
  <meta name="description" content="목표와 하루의 기록을 이어 가기 위해 GrowLog에 로그인하는 화면">
  <meta name="theme-color" content="#fbf7ef">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../../../common/css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>

  <div class="auth">
    <aside class="auth__aside" aria-label="GrowLog 소개">
      <a class="logo logo--invert" href="index.html">
        <span class="logo__mark"><svg class="icon" aria-hidden="true"><use href="#i-sprout"></use></svg></span>
        <span>GrowLog</span>
      </a>
      <figure class="auth__quote">
        <blockquote>
          <p>“어제보다 조금 나아진 오늘을<br>기록으로 확인할 수 있다는 게<br>생각보다 큰 힘이 됐어요.”</p>
        </blockquote>
        <figcaption>12일째 기록 중인 성장러님</figcaption>
      </figure>
      <ol class="auth__steps" aria-hidden="true">
        <li><span class="auth__dot"></span>9월 22일 · 포트폴리오 메인 반응형 점검</li>
        <li><span class="auth__dot"></span>9월 21일 · 모달 포커스 트랩 구현</li>
        <li><span class="auth__dot auth__dot--goal"></span>9월 1일 · 웹 접근성 정리하기 목표 등록</li>
      </ol>
    </aside>

    <main class="auth__main" id="main">
      <a class="logo auth__mobile-logo" href="index.html">
        <span class="logo__mark"><svg class="icon" aria-hidden="true"><use href="#i-sprout"></use></svg></span>
        <span>GrowLog</span>
      </a>

      <div class="auth__panel">
        <h1 class="auth__title">다시 오셨네요</h1>
        <p class="auth__desc">로그인하고 오늘의 기록을 이어가세요.</p>

        <p class="auth__demo">
          <svg class="icon" aria-hidden="true"><use href="#i-alert"></use></svg>
          <span>데모 계정 <strong>grower@growlog.kr</strong> / <strong>growlog123!</strong> 로 로그인할 수 있습니다.</span>
        </p>

        <form class="auth__form" id="loginForm" novalidate>
          <div class="form-alert" id="loginAlert" role="alert" tabindex="-1" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-alert"></use></svg>
            <span id="loginAlertText"></span>
          </div>

          <div class="field">
            <label class="field__label" for="email">이메일</label>
            <input class="input" type="email" id="email" name="email" autocomplete="email" inputmode="email" placeholder="example@growlog.kr" aria-describedby="emailError" required>
            <p class="field__error" id="emailError" hidden></p>
          </div>

          <div class="field">
            <label class="field__label" for="password">비밀번호</label>
            <div class="input-wrap">
              <input class="input" type="password" id="password" name="password" autocomplete="current-password" aria-describedby="passwordError" required>
              <button class="icon-btn" type="button" data-toggle-password="password" aria-label="비밀번호 보기" aria-pressed="false">
                <svg class="icon" aria-hidden="true"><use href="#i-eye"></use></svg>
              </button>
            </div>
            <p class="field__error" id="passwordError" hidden></p>
          </div>

          <div class="auth__row">
            <label class="check">
              <input type="checkbox" name="remember">
              <span>로그인 상태 유지</span>
            </label>
            <a class="auth__sub-link" href="#" data-not-ready>비밀번호 찾기</a>
          </div>

          <button class="btn btn--primary btn--lg btn--block" type="submit">로그인</button>
        </form>

        <p class="auth__switch">아직 계정이 없나요? <a class="text-link" href="signup.html">회원가입</a></p>
      </div>
    </main>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

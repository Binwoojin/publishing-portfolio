# 운영 프로필. SPRING_PROFILES_ACTIVE=prod로 활성화한다.
#
# application.yaml(공통 설정)이 로컬 개발 편의를 기준으로 되어 있어서
# (ddl-auto: update, show-sql: true, CORS 기본값이 localhost:5173) 그대로
# 운영에 배포하면 위험하다 — 이 파일이 그 값들만 운영 기준으로 덮어쓴다.
spring:
  jpa:
    hibernate:
      # update는 운영 스키마를 애플리케이션이 자동으로 변경할 수 있어 위험하다.
      # validate로 바꿔서 Entity와 실제 DB 스키마가 다르면(마이그레이션을
      # 깜빡한 경우) 애플리케이션이 조용히 스키마를 바꾸는 대신 즉시 실패하게 한다.
      ddl-auto: validate
    # 운영 로그에 매 쿼리의 상세 SQL이 남지 않도록 끈다.
    show-sql: false

app:
  cors:
    # 로컬 기본값(localhost:5173)으로 조용히 fallback하지 않도록 기본값을 두지 않는다.
    # 운영에서 CORS_ALLOWED_ORIGINS를 실제 배포 도메인으로 설정하지 않으면
    # 앱이 시작 시점에 바로 실패해야 한다 — 운영에서 CORS가 localhost로 열려
    # 있는 채로 조용히 떠 있는 것보다 낫다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

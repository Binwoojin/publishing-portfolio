spring:
  application:
    name: growlog_project


    # ===========================
    # MySQL (AWS RDS)
    # ===========================


  datasource:
    # 기본값은 지금 쓰는 RDS 주소 그대로다 — DB_URL을 안 넣어도 기존 env.sh/env.bat
    # 설정 그대로 동작한다. 다른 환경(예: 테스트용 별도 인스턴스)을 쓸 때만
    # DB_URL을 오버라이드하면 된다.
    url: ${DB_URL:jdbc:mysql://growlog-db.cx46sswa4e8c.ap-northeast-2.rds.amazonaws.com:3306/growlog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver


  # ===========================
  # JPA
  # ===========================


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql=true
    database-platform: org.hibernate.dialect.MySQLDialect
    # Open Session In View를 끈다. 기본값(true)은 컨트롤러가 끝난 뒤에도
    # JPA 세션을 뷰 렌더링(JSP)까지 열어두는데, 이 안티패턴을 끄면
    # 지연 로딩을 컨트롤러/서비스 계층 밖에서 실수로 사용하는 걸 막아준다.
    # master 브랜치가 독립적으로 같은 결론에 도달해서 그대로 반영했다.
    open-in-view: false

    # ===========================
    # JSP View Resolver
    # ===========================

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

  # 성장 기록 이미지 업로드(S3) 요청 크기 제한
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

      # ===========================
      # Email 인증 진행을 위한 설정
      # ===========================

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    default-encoding: UTF-8

    properties:
      mail:
        smtp:
          auth: true

          starttls:
            enable: true
            required: true

          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  servlet:
    session:
      cookie:
        # 세션 쿠키(JSESSIONID)의 기본 SameSite 값은 Lax인데, 이 값은
        # Cross-Origin XHR/fetch 요청(Vue :5173 -> Spring Boot :8080)에는
        # 브라우저가 쿠키를 아예 실어 보내지 않는다. (Lax는 "같은 사이트로의
        # 최상위 이동(링크 클릭 등)"에만 쿠키를 허용하고, XHR/fetch 같은
        # sub-request에는 method와 무관하게 무조건 차단한다.)
        # CSRF 토큰은 JS가 document.cookie로 직접 읽어 헤더에 실어 보내므로
        # 이 제약을 안 받지만, 세션 쿠키는 브라우저가 자동으로 붙이는 것이라
        # SameSite=None으로 명시해야 로그인 후 GET /api/me 같은 요청에
        # 세션이 유지된다.
        #
        # SameSite=None인 쿠키는 브라우저가 Secure 속성도 함께 요구한다.
        # 원래는 HTTPS에서만 유효하지만, 최신 브라우저는 http://localhost를
        # "안전한 컨텍스트"로 취급해 로컬 개발(http)에서도 정상 동작한다.
        # 실제 배포 시에는 프론트/백엔드 모두 HTTPS를 쓰게 되므로 이 설정이
        # 그대로 맞는 설정이 된다.
        same-site: none
        secure: true

app:
  cors:
    # 콤마로 구분된 허용 Origin 목록. Vue 개발 서버(Vite) 기본 포트를 기본값으로 둔다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  s3:
    bucket: ${S3_BUCKET:growlog-media-2026}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region:
      static: ${AWS_REGION:ap-northeast-2}





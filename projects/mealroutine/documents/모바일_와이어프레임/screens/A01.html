<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>A01 로그인</title><link rel="stylesheet" href="../wireframe-base.css"><link rel="stylesheet" href="../wireframe.css"><body><div class="canvas" data-domain="brand"><div class="wf-status"><span>9:41</span><span>모바일 와이어프레임 · 390px</span></div><header class="wf-head"><span>〈</span><strong>로그인</strong><span>♧</span></header><main class="appbody" id="body"><div class="brand-login"><section class="brand-login-intro"><div class="brand-login-scene"><div class="wf-image">이미지·일러스트 영역</div></div><h2>운동도, 식단도.<br>다시 나의 루틴으로.</h2><p>운동과 식단의 기록이 꾸준한 건강 습관으로.<br>무료로 가입하고 나에게 맞는 루틴을 시작하세요.</p></section><div class="brand-login-form"><div class="card"><span class="num">1</span><h3>로그인</h3><form data-form="auth"><label>이메일<input class="input" name="email" autocomplete="username" placeholder="이메일 주소를 입력해 주세요" type="email" value="" required  data-draft="email"></label><label for="login-password-input">비밀번호</label><div class="login-password-control"><input class="input" name="password" id="login-password-input" type="password" required autocomplete="current-password" placeholder="비밀번호를 입력해 주세요"><button type="button" class="login-password-toggle" data-login-password-toggle aria-controls="login-password-input" aria-pressed="false" aria-label="비밀번호 보기" title="비밀번호 보기"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><p class="form-error" role="alert" hidden></p><button class="primary" type="submit">로그인하고 시작하기</button></form><div class="brand-login-recovery"><a href="#A04">비밀번호를 잊으셨나요?</a></div></div></div><div class="brand-login-signup"><span>처음 오셨나요?</span><a href="#A03">무료 회원가입 <span aria-hidden="true">→</span></a><p>기본 기록과

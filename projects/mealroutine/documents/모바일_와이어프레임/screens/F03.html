<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>F03 없는 음식 등록 요청</title><link rel="stylesheet" href="../wireframe-base.css"><link rel="stylesheet" href="../wireframe.css"><body><div class="canvas" data-domain="meal"><div class="wf-status"><span>9:41</span><span>모바일 와이어프레임 · 390px</span></div><header class="wf-head"><span>〈</span><strong>없는 음식 등록 요청</strong><span>♧</span></header><main class="appbody" id="body"><div class="food-request-page"><div class="eyebrow">REQUEST A FOOD</div><h2>찾는 음식이 없었나요?</h2><p class="subtitle">정확한 음식명이나 제품명을 적어주세요.<br>영양표가 있다면 함께 첨부할 수 있어요.</p><div class="card"><span class="num">1</span><h3>어떤 음식인가요?</h3><form data-form="request"><label>음식 이름 <span class="food-required">필수</span><input class="input" name="foodName" type="text" value="" required  data-draft="foodName"></label><p class="food-field-help">예: 현미 즉석밥, 무가당 그릭요거트</p><label>브랜드 <span class="food-optional">선택</span><input class="input" name="brand" type="text" value=""   data-draft="brand"></label><div class="food-upload-field"><label>영양표 사진 <span class="food-optional">선택</span><input class="input" type="file" name="attachment" accept="image/*" data-file="request"></label><p>영양정보가 보이는 사진 · 최대 10MB</p></div><p class="food-request-demo">시안용 요청이며 사진은 전송되지 않아요.</p><p class="form-error" role="alert" hidden></p><button class="primary" type="submit">음식 등록 요청하기</button></form></div><div class="food-request-alternative">등록 전에 비슷한 음식으로 먼저 기록할 수 있어요. <button type="button" class="secondary" data-meal-start="today">음식 검색해 기록하기</button></div></div></main><footer class="wf-nav"><span class="">홈</span><span class="on">탐색</span><span class="">기록</span><span class="">AI</span><span class="">마이</span></footer></div></body></html>

<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>S02 문의 작성</title><link rel="stylesheet" href="../wireframe-base.css"><link rel="stylesheet" href="../wireframe.css"><body><div class="canvas" data-domain="brand"><div class="wf-status"><span>9:41</span><span>모바일 와이어프레임 · 390px</span></div><header class="wf-head"><span>〈</span><strong>문의 작성</strong><span>♧</span></header><main class="appbody" id="body"><div class="support-compose"><header><span class="support-compose-symbol" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span><h2>무엇을 도와드릴까요?</h2><p>궁금한 점이나 불편했던 내용을 남겨 주세요.</p></header><form data-form="inquiry"><fieldset><legend><span>01</span> 문의 유형</legend><p>문의에 맞는 항목을 선택해 주세요.</p><div class="chips" role="group" aria-label="inquiryType"><button type="button" class="chip on" aria-pressed="true" data-action="option" data-key="inquiryType" data-arg="기록 이용">기록 이용</button><button type="button" class="chip " aria-pressed="false" data-action="option" data-key="inquiryType" data-arg="계정">계정</button><button type="button" class="chip " aria-pressed="false" data-action="option" data-key="inquiryType" data-arg="멤버십">멤버십</button><button type="button" class="chip " aria-pressed="false" data-action="option" data-key="inquiryType" data-arg="음식 요청">음식 요청</button></div></fieldset><fieldset><legend><span>02</span> 문의 내용</legend><label for="support-inquiry-title">제목 <small>필수</small></label><input class="input" id="support-inquiry-title" name="inquiryTitle" data-draft="inquiryTitle" value="" placeholder="문의 내용을 한 줄로 적어 주세요" maxlength="80" required><label for="support-inquiry-body">내용 <small>필수</small></label><textarea class="input" id="support-inquiry-body" name="inquiryBody" data-draft="inquiryBody" rows="7" maxlength="2000" placeholder="어느 화면에서 어떤 상황이 있었는지 알려 주세요." required></textarea><p class="support-compose-hint">비밀번호·2차 비밀번호 등 인증 정보는 적지 마세요.</p></fieldset><div class="support-compose-guide"><strong>답변은 내 문의에서 확인해요</strong><p>문의 등록 후 마이페이지의 내 문의로 이동해요.</p></div><button class="primary support-compose-submit" type="submit">문의 등록하기</button><p class="support-compose-demo">시안에서는 문의가 현재 탭에만 저장돼요.</p></form></div></main><footer class="wf-nav"><span class="">홈</span><span class="">탐색</span><span class="">기록</span><span class="">AI</span><span class="on">마이</span></footer></div></body></html>

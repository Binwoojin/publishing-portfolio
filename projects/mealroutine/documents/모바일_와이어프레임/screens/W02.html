<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>W02 직접 운동 목록 구성</title><link rel="stylesheet" href="../wireframe-base.css"><link rel="stylesheet" href="../wireframe.css"><body><div class="canvas" data-domain="exercise"><div class="wf-status"><span>9:41</span><span>모바일 와이어프레임 · 390px</span></div><header class="wf-head"><span>〈</span><strong>직접 운동 목록 구성</strong><span>♧</span></header><main class="appbody" id="body"><div class="workout-editor workout-session"><div class="eyebrow"></div><h2>운동 목록 구성</h2><p class="subtitle">운동 목록을 만들고, 세트마다 시간을 측정해요.</p><div class="tabs"><button type="button" class="on" data-action="date" data-arg="today" aria-pressed="true">오늘 실제 기록</button><button type="button" class="" data-action="date" data-arg="tomorrow" aria-pressed="false">내일 계획</button></div><ol class="workout-flow" aria-label="운동 진행 단계"><li aria-current="step">1 목록 구성</li><li >2 운동 진행</li><li >3 결과 확인</li></ol><div class="card"><span class="num">1</span><h3><span class="session-order">1</span> 의자 스쿼트</h3><div class="session-list-actions"><button type="button" class="secondary" data-session-action="up" data-item="0" disabled>위로</button><button type="button" class="secondary" data-session-action="down" data-item="0" disabled>아래로</button><button type="button" class="secondary" data-session-action="remove" data-item="0" disabled>삭제</button></div><div class="session-set-row"><span>1세트</span><label><input type="number" min="1" step="1" value="10" data-session-reps="0" data-index="0" aria-label="의자 스쿼트 1세트 횟수"> 회</label><button type="button" class="secondary" data-session-action="remove-set" data-item="0" data-index="0" >삭제</button></div><div class="session-set-row"><span>2세트</span><label><input type="number" min="1" step="1" value="10" data-session-reps="0" data-index="1" aria-label="의자 스쿼트 2세트 횟수"> 회</label><button type="button" class="secondary" data-session-action="remove-set" data-item="0" data-index="1" >삭제</button></div><button type="button" class="secondary" data-session-action="add-set" data-item="0">＋ 세트 추가</button></div><section class="session-add"><label for="session-exercise-choice">목록에 운동 추가</label><select id="session-exercise-choice"><option value="0">의자 스쿼트</option><option value="1">월 푸시업</option><option value="2">서서 무릎 올리기</option><option value="3">어깨 스트레칭</option><option value="4">덤벨 로우</option></select><button type="button" class="secondary" data-session-action="add" >＋ 운동 추가</button></section><p class="session-help">시간 측정 없이 완료한 세트와 횟수를 직접 기록할 수도 있어요.</p><section class="session-target-times"><h3>세트별 목표 시간</h3><p class="session-help">각 세트의 목표 시간을 초 단위로 설정해요. 초기 60초는 편집용 예시이며 추천 시간이 아니에요.</p><div><h4>의자 스쿼트</h4><label>1세트<input type="number" min="1" max="3600" step="1" value="60" data-set-target="0" data-set-index="0" aria-label="의자 스쿼트 1세트 목표 시간"> 초</label><label>2세트<input type="number" min="1" max="3600" step="1" value="60" data-set-target="0" data-set-index="1" aria-label="의자 스쿼트 2세트 목표 시간"> 초</label></div></section><div class="workout-editor-footer"><button type="button" class="primary" data-workout-list-action="review-draft" data-list-id="">운동 목록 저장 · 최종 검토</button><button type="button" class="secondary" data-session-action="manual" >시간 측정 없이 기록하기</button><button type="button" class="secondary" data-action="nav" data-arg="W01">취소</button></div></div></main><footer class="wf-nav"><span class="">홈</span><span class="">탐색</span><span class="on">기록</span><span class="">AI</span><span class="">마이</span></footer></div></body></html>

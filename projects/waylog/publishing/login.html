<!DOCTYPE html>
<html lang="ko" class="is-guest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | WayLog</title>
  <meta name="description" content="WayLog 로그인 · 회원가입">
  <meta name="theme-color" content="#f2f5f4">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <script>try{if(JSON.parse(localStorage.getItem('waylog:auth'))===true)document.documentElement.className='is-member';}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 웹폰트 CSS 가 첫 화면 표시를 막지 않도록 비동기로 불러온다 -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" onload="this.onload=null;this.removeAttribute('as');this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap"></noscript>
  <link rel="stylesheet" href="../../../common/css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>
  <div class="auth">
    <div class="auth__visual" aria-hidden="true">
      <img src="images/login-background.webp" srcset="images/login-background-400.webp 400w, images/login-background.webp 800w, images/login-background@2x.webp 1600w" sizes="50vw" alt="" width="800" height="1067" loading="lazy">
      <div class="auth__quote">
        <p class="mono">37.6587°N 126.9779°E · 북한산 백운대</p>
        <p class="auth__quote-text">당신의 모든 여행 기록이<br>새로운 이야기로 이어집니다.</p>
      </div>
    </div>
    <main class="auth__main" id="main">
      <div class="auth__top"><a class="logo" href="index.html" aria-label="WayLog 홈"><svg class="logo__mark" viewBox="0 0 32 32" aria-hidden="true"><path class="route" d="M5 27c6-1 7-7 12-8s8-3 9-9"/><circle class="dot" cx="5" cy="27" r="2.6"/><path class="pin" d="M26 2.5a5.5 5.5 0 0 0-5.5 5.5c0 4.2 5.5 9 5.5 9s5.5-4.8 5.5-9A5.5 5.5 0 0 0 26 2.5Zm0 7.6a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2Z"/></svg><span aria-hidden="true">WayLog</span></a><a class="more-link" href="index.html"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>홈으로</a></div>
      <div class="auth__panel">
        <h1 class="auth__title">다시, 여행을 이어가 볼까요?</h1>
        <p class="auth__desc">여행의 순간을 기록하고 함께 나눠 보세요.</p>
        <p class="auth__demo"><svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg><span>데모 계정 <strong class="mono">traveler@waylog.kr</strong> / <strong class="mono">waylog123!</strong></span>
          <button class="btn btn--ghost btn--sm" type="button" id="fillDemo">자동 입력</button></p>

        <form class="auth__form" id="loginForm" novalidate>
          <div class="form-alert" id="loginAlert" role="alert" tabindex="-1" hidden><svg class="icon" aria-hidden="true"><use href="#i-alert"></use></svg><span id="loginAlertText"></span></div>
          <div class="field">
            <label class="field__label" for="email">이메일</label>
            <input class="input" type="email" id="email" autocomplete="email" inputmode="email" placeholder="example@waylog.kr" aria-describedby="emailError" required>
            <p class="field__error" id="emailError" hidden></p>
          </div>
          <div class="field">
            <label class="field__label" for="password">비밀번호</label>
            <div class="input-wrap">
              <input class="input" type="password" id="password" autocomplete="current-password" aria-describedby="passwordError" required>
              <button class="icon-btn" type="button" data-toggle-password="password" aria-label="비밀번호 보기" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-eye"></use></svg></button>
            </div>
            <p class="field__error" id="passwordError" hidden></p>
          </div>
          <div class="auth__row">
            <label class="check"><input type="checkbox" id="keep"><span>로그인 상태 유지</span></label>
            <a class="more-link" href="#" data-not-ready>비밀번호 찾기</a>
          </div>
          <button class="btn btn--primary btn--lg btn--block" type="submit">로그인</button>
        </form>
        <p class="auth__switch">아직 회원이 아니신가요? <a class="text-link" href="signup.html">회원가입</a></p>
      </div>
    </main>
  </div>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
